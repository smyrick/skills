name: Release OCI package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check skill formatting and metadata
        run: npm run check

      - name: Package OCI artifact
        run: npm run oci:package

      - name: Publish OCI artifact
        run: npm run oci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
