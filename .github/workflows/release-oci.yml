name: Release skills and plugins

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: tools/skills-ref/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Install pinned upstream skill validator
        run: npm run setup:spec

      - name: Check formatting without rewriting metadata
        run: npm run format:check

      - name: Validate shared skill specification and package references
        run: npm run check:skills && npm run check:package

      - name: Validate OpenAI profile
        run: npm run check:openai

      - name: Validate Claude Code profile
        run: npm run check:claude

      - name: Validate repository policy and target parity
        run: npm run check:policy && npm run check:parity

      - name: Validate plugin manifests, catalogs, and generated parity
        run: npm run check:plugins

      - name: Run contract and packaging regression tests
        run: npm run test:contract

      - name: Package and verify OCI artifact
        run: npm run oci:smoke

      - name: Package and independently verify plugin downloads
        run: npm run plugin:package && npm run plugin:verify

      - name: Publish OCI artifact
        run: npm run oci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload plugin downloads
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            .dist/plugins/*.tar.gz .dist/plugins/SHA256SUMS \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
